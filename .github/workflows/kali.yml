name: Test

on:
  push:
    branches:
      - develop

jobs:
  one:
    runs-on: ubuntu-latest  
    steps:  
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: test
          path: .github/workflows/test.txt
          retention-days: 1

  two:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    needs: one
    steps:
      - name: Download
        uses: actions/download-artifact@v4
        with:
          name: test
